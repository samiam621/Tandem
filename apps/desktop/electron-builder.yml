appId: com.tandem.app
productName: Tandem
copyright: Copyright © 2024

directories:
  output: dist-electron

files:
  - out/**/*
  - node_modules/**/*

protocols:
  - name: Tandem
    schemes:
      - tandem

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
