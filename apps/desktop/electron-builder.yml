appId: com.tandem.app
productName: Tandem
copyright: Copyright © 2026

directories:
  output: dist-electron

# Fixed file names so README download links (releases/latest/download/...) keep working.
artifactName: Tandem-${os}-${arch}.${ext}
afterPack: scripts/adhoc-sign.cjs
# Installed app is named "Tandem" (own data folder), separate from `npm run dev` (@tandem/desktop).
extraMetadata:
  productName: Tandem

files:
  - out/**/*
  - node_modules/**/*

protocols:
  - name: Tandem
    schemes:
      - tandem

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
